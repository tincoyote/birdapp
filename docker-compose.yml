version: '3.8'

services:
  birdapp:
    build: .
    container_name: birdapp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Timestamps are stamped with the container's local time; without this
      # the container ran on UTC and evening photos showed as tomorrow's date.
      - TZ=America/Los_Angeles
    env_file:
      # Loads ADMIN_USERNAME/ADMIN_PASSWORD/API_USERNAME/API_PASSWORD
      # directly as real container env vars (gitignored, real values only).
      # Deliberately NOT using ${ADMIN_USERNAME}-style substitution in an
      # `environment:` block - if .env goes missing, that pattern silently
      # substitutes an empty string rather than actually failing, which is
      # a worse outcome than the loud "changeme" default this whole setup
      # exists to avoid. env_file instead raises a clear error if .env
      # isn't found. See .env.example for the expected shape.
      - .env
